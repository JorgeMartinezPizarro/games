# Override of docker-compose.yml ONLY for the E2E tests (Playwright).
#
# Usage (playwright.config.ts does it automatically, no need to run it by hand):
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#     --env-file .env.e2e -p games-e2e up --build -d
#
# What it isolates from your normal development stack:
#  - local build of the Dockerfile (not the published :latest image), so the
#    tests always run the code in your working tree.
#  - its own cache/e2e/audio, and MariaDB/Nextcloud data in memory (tmpfs),
#    so test games never get mixed with your real dev data.
#  - different ports: taken from .env.e2e (PORT/STOCKFISH_PORT/WORDLIST_PORT),
#    so it can coexist with a dev `docker compose up` that is already running.
#
# Why tmpfs: every e2e run starts from scratch (`down` + `up`), so MariaDB
# initializes an empty data dir and Nextcloud copies its whole source into
# /var/www/html and installs itself, every time. On a slow disk (Docker on an
# external drive) the Nextcloud part alone took ~6.5 min. In RAM those writes
# are nearly free, and the data is thrown away when the container is removed
# anyway (what a clean run wants). Cost: a few hundred MB of RAM while the
# stack is up. Not a host bind mount on purpose: on Docker Desktop for Windows
# /var/lib/mysql over the gRPC-FUSE/VirtioFS layer made MariaDB see a database
# it had just created as "nonexistent" ("Unknown database 'games'").
services:
  games:
    build:
      context: .
      dockerfile: Dockerfile
    image: games-e2e:local
    volumes:
      - ./cache/e2e/audio/:/app/cache/audio
  mariadb:
    # Same target as the base bind mount (./cache/database), so compose
    # replaces it instead of adding a second mount.
    volumes:
      - type: tmpfs
        target: /var/lib/mysql
  nextcloud:
    # Replaces the image's anonymous /var/www/html volume. The gaming app bind
    # mount (docker-compose.nextcloud.yml) is nested inside and still applies.
    volumes:
      - type: tmpfs
        target: /var/www/html
  wordlist:
    volumes:
      - ./cache/e2e/audio/:/app/audio
