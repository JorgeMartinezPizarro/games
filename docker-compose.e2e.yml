# Override of docker-compose.yml ONLY for the E2E tests (Playwright).
#
# Usage (playwright.config.ts does it automatically, no need to run it by hand):
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#     --env-file .env.e2e -p games-e2e up --build -d
#
# What it isolates from your normal development stack:
#  - local build of the Dockerfile (not the published :latest image), so the
#    tests always run the code in your working tree.
#  - its own cache/e2e/* (audio + MariaDB data) so test games never get
#    mixed with your real dev data.
#  - different ports: taken from .env.e2e (PORT/STOCKFISH_PORT/WORDLIST_PORT),
#    so it can coexist with a dev `docker compose up` that is already running.
services:
  games:
    build:
      context: .
      dockerfile: Dockerfile
    image: games-e2e:local
    volumes:
      - ./cache/e2e/audio/:/app/cache/audio
  mariadb:
    # Named volume (not a bind mount to cache/e2e/): on Docker Desktop for
    # Windows, a host bind mount for /var/lib/mysql goes through the
    # gRPC-FUSE/VirtioFS translation layer, and there MariaDB may see a database
    # it has just created as "nonexistent" for the first real connection
    # (seen as "Unknown database 'games'" right after Playwright's webServer
    # `up --build`, reproducibly). A named volume lives natively on the
    # Docker VM's filesystem, without that layer, which is exactly what both
    # Docker and MariaDB recommend for database data.
    volumes:
      - mariadb-e2e-data:/var/lib/mysql
  wordlist:
    volumes:
      - ./cache/e2e/audio/:/app/audio

volumes:
  mariadb-e2e-data:
