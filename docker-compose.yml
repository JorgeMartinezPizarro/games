services:
  games:
    image: jorgemartinezpizarro/games:latest
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    # Exposed locally to communicate with nginx
    ports:
      - 127.0.0.1:${PORT}:${PORT}
    environment:
      - PORT=${PORT}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_PUBLIC_URL=${NEXTCLOUD_PUBLIC_URL:-}
      - NEXTCLOUD_GAMING_SECRET=${NEXTCLOUD_GAMING_SECRET}
      - NEXT_PUBLIC_CHESS_URL=http://stockfish:8080
      - NEXT_PUBLIC_WORD_URL=http://wordlist:5000
      - MARIADB_HOST=mariadb
      - MARIADB_PORT=3306
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - ./cache/audio/:/app/cache/audio
  mariadb:
    image: mariadb:11
    restart: always
    # Exposed locally so `games` can run outside docker (npm run
    # dev/start) against the same MariaDB the dockerized stack uses.
    ports:
      - 127.0.0.1:${MARIADB_PORT:-1010}:3306
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - ./cache/database:/var/lib/mysql
    healthcheck:
      # It's not enough for the server to answer a ping (mariadb-admin ping):
      # that only confirms it accepts connections, not that the schema/user the
      # app uses can already be queried. It checks with the app's real
      # credentials so that `depends_on: condition: service_healthy`
      # means "games can already connect and run queries", not just "the
      # port is open".
      test: ["CMD", "mariadb", "-u", "${MARIADB_USER}", "-p${MARIADB_PASSWORD}", "${MARIADB_DATABASE}", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
  wordlist:
    image: jorgemartinezpizarro/wordlist:latest
    # Exposed locally to comunicate with node
    ports:
      - 127.0.0.1:${WORDLIST_PORT:-1009}:5000
    volumes:
      - ./cache/audio/:/app/audio
  stockfish:
    image: jorgemartinezpizarro/stockfish:latest
    # Exposed locally to comunicate with node
    ports:
      - 127.0.0.1:${STOCKFISH_PORT:-1007}:8080
