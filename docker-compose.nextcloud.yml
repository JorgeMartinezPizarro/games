# Nextcloud 34 local, SOLO para `make dev` y los e2e: se añade encima de
# docker-compose.yml (ver Makefile y playwright.config.ts). En prod Nextcloud
# es otro stack detrás del reverse proxy y games apunta a él vía NEXTCLOUD_URL.
#
# - La app gaming se monta en caliente desde nextcloud/custom_apps/gaming: un
#   cambio en el PHP/JS se ve al recargar, sin reconstruir nada.
# - nextcloud/dev/before-starting.sh la activa y configura (games_url,
#   shared_secret) y crea los usuarios de prueba en cada arranque.
# - games habla con Nextcloud por la red interna de compose (http://nextcloud);
#   el navegador, por http://localhost:${NEXTCLOUD_PORT}. Como las cookies no
#   distinguen puertos, la sesión de Nextcloud en localhost vale también para
#   games en localhost:${PORT}.
services:
  nextcloud:
    build:
      context: ./nextcloud/dev
    image: games-nextcloud-dev:34
    restart: unless-stopped
    ports:
      - 127.0.0.1:${NEXTCLOUD_PORT}:80
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud
      - GAMING_GAMES_URL=${NEXTCLOUD_GAMES_URL}
      - GAMING_SHARED_SECRET=${NEXTCLOUD_GAMING_SECRET}
      - GAMING_TEST_USERS=${NEXTCLOUD_TEST_USERS}
      - GAMING_TEST_PASSWORD=${NEXTCLOUD_TEST_PASSWORD}
    volumes:
      - ./nextcloud/custom_apps/gaming:/var/www/html/custom_apps/gaming
    healthcheck:
      # Apache solo arranca tras instalar y correr el hook, así que "installed"
      # en status.php significa "app gaming ya configurada".
      test: ["CMD", "php", "-r", "exit(str_contains((string) @file_get_contents('http://localhost/status.php'), '\"installed\":true') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  games:
    environment:
      - NEXTCLOUD_URL=http://nextcloud
      # Para mandar al navegador al login de Nextcloud (proxy.ts).
      - NEXTCLOUD_PUBLIC_URL=http://localhost:${NEXTCLOUD_PORT}
    depends_on:
      nextcloud:
        condition: service_healthy
