# Local Nextcloud 34, ONLY for `make dev` and the e2e tests: layered on top of
# docker-compose.yml (see Makefile and playwright.config.ts). In prod Nextcloud
# is another stack behind the reverse proxy and games points to it via NEXTCLOUD_URL.
#
# - The gaming app is hot-mounted from nextcloud/custom_apps/gaming: a
#   PHP/JS change shows up on reload, without rebuilding anything.
# - nextcloud/dev/before-starting.sh enables and configures it (games_url,
#   shared_secret) and creates the test users on every startup.
# - games talks to Nextcloud over the internal compose network (http://nextcloud);
#   the browser, via http://localhost:${NEXTCLOUD_PORT}. Since cookies don't
#   distinguish ports, the Nextcloud session on localhost is also valid for
#   games on localhost:${PORT}.
services:
  nextcloud:
    build:
      context: ./nextcloud/dev
    image: games-nextcloud-dev:34
    restart: unless-stopped
    ports:
      - 127.0.0.1:${NEXTCLOUD_PORT}:80
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud
      - GAMING_GAMES_URL=${NEXTCLOUD_GAMES_URL}
      - GAMING_SHARED_SECRET=${NEXTCLOUD_GAMING_SECRET}
      - GAMING_TEST_USERS=${NEXTCLOUD_TEST_USERS}
      - GAMING_TEST_PASSWORD=${NEXTCLOUD_TEST_PASSWORD}
    volumes:
      - ./nextcloud/custom_apps/gaming:/var/www/html/custom_apps/gaming
    healthcheck:
      # Apache only starts after installing and running the hook, so "installed"
      # in status.php means "gaming app already configured".
      test: ["CMD", "php", "-r", "exit(str_contains((string) @file_get_contents('http://localhost/status.php'), '\"installed\":true') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  games:
    environment:
      - NEXTCLOUD_URL=http://nextcloud
      # To send the browser to the Nextcloud login (proxy.ts).
      - NEXTCLOUD_PUBLIC_URL=http://localhost:${NEXTCLOUD_PORT}
    depends_on:
      nextcloud:
        condition: service_healthy
