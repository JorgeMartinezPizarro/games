# Override of docker-compose.yml (+ docker-compose.nextcloud.yml) for
# `make dev`. Ports and credentials live in .env.development, the same file
# `npm run dev` uses.
#
# What it isolates from the prod stack:
#  - local build of the Dockerfile (not the published :latest image).
#  - its own data: cache/dev/audio and named volumes for MariaDB and
#    Nextcloud (see docker-compose.e2e.yml on why MariaDB doesn't use a bind
#    mount on Docker Desktop). They persist across `make dev`; `make dev-reset`
#    wipes them.
services:
  games:
    build:
      context: .
      dockerfile: Dockerfile
    image: games-dev:local
    volumes:
      - ./cache/dev/audio/:/app/cache/audio
  mariadb:
    volumes:
      - mariadb-dev-data:/var/lib/mysql
  wordlist:
    volumes:
      - ./cache/dev/audio/:/app/audio
  nextcloud:
    volumes:
      - nextcloud-dev-data:/var/www/html

volumes:
  mariadb-dev-data:
  nextcloud-dev-data:
